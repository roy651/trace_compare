[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trace-compare"
version = "0.1.0"
description = "Step-by-step comparison of successful and failed agent traces, with LLM-based rule design and root-cause analysis."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "rapidfuzz",
    "jinja2",
    "litellm",
    "python-dotenv",
]

[project.optional-dependencies]
semantic = ["sentence-transformers"]
dev = ["pytest", "ruff"]

[project.scripts]
trace-compare = "trace_compare.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_compare"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
